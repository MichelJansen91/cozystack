suite: cozystack-api ingress vs TLSRoute mode switch
templates:
  - templates/api-tlsroute.yaml
  - templates/api-ingress.yaml

release:
  name: cozystack-api
  namespace: cozy-system

# The cozystack-api chart materializes the kubernetes API exposure
# via either an Ingress (legacy) or a TLSRoute (Gateway API). The
# `_cluster.gateway-enabled` flag is the toggle:
#   - "false" (default) → Ingress, no TLSRoute
#   - "true"            → TLSRoute, no Ingress
# These are mutually exclusive — they share the same DNS hostname
# (`api.<root-host>`) and would conflict if both rendered. The PR that
# introduces Gateway API support depends on this toggle behaving
# correctly: per-system-app templates flip together with the
# platform-wide switch, and a refactor that breaks one direction
# silently would land us in a state where the legacy ingress keeps
# serving traffic while the operator believes Gateway mode is active.

tests:
  - it: gateway-enabled=false renders Ingress only
    set:
      _cluster:
        root-host: example.org
        expose-services: "api"
        gateway-enabled: "false"
    asserts:
      - template: templates/api-ingress.yaml
        equal:
          path: kind
          value: Ingress
      - template: templates/api-tlsroute.yaml
        hasDocuments:
          count: 0

  - it: separateAddress passes the API through the passthrough Gateway
    set:
      _cluster:
        root-host: example.org
        expose-services: "api"
        gateway-enabled: "true"
        gateway-passthrough-mode: separateAddress
    asserts:
      - template: templates/api-tlsroute.yaml
        hasDocuments:
          count: 1
      - template: templates/api-tlsroute.yaml
        equal:
          path: kind
          value: TLSRoute
      - template: templates/api-tlsroute.yaml
        equal:
          path: apiVersion
          value: gateway.networking.k8s.io/v1alpha2
      - template: templates/api-tlsroute.yaml
        equal:
          path: metadata.namespace
          value: default
      - template: templates/api-tlsroute.yaml
        equal:
          path: spec.hostnames[0]
          value: api.example.org
      - template: templates/api-tlsroute.yaml
        equal:
          path: spec.parentRefs[0].sectionName
          value: tls-api
      # The port-443 passthrough listeners render on a Gateway of their
      # own; the main one has no tls-api section.
      - template: templates/api-tlsroute.yaml
        equal:
          path: spec.parentRefs[0].name
          value: cozystack-passthrough
      - template: templates/api-ingress.yaml
        hasDocuments:
          count: 0

  # The native-port listener on the main Gateway admits routes from the
  # publishing tenant's namespace alone, so the route lives there and a
  # ReferenceGrant lets it reach the kubernetes Service in default.
  - it: singleAddress passes the API through tls-api on the main Gateway
    set:
      _cluster:
        root-host: example.org
        expose-services: "api"
        expose-ingress: tenant-root
        gateway-enabled: "true"
    asserts:
      - template: templates/api-tlsroute.yaml
        hasDocuments:
          count: 2
      - template: templates/api-tlsroute.yaml
        documentIndex: 0
        equal:
          path: metadata.namespace
          value: tenant-root
      - template: templates/api-tlsroute.yaml
        documentIndex: 0
        equal:
          path: spec.parentRefs[0]
          value:
            group: gateway.networking.k8s.io
            kind: Gateway
            name: cozystack
            namespace: tenant-root
            sectionName: tls-api
      - template: templates/api-tlsroute.yaml
        documentIndex: 0
        equal:
          path: spec.rules[0].backendRefs[0]
          value:
            name: kubernetes
            namespace: default
            port: 443
      - template: templates/api-tlsroute.yaml
        documentIndex: 1
        equal:
          path: kind
          value: ReferenceGrant
      - template: templates/api-tlsroute.yaml
        documentIndex: 1
        equal:
          path: metadata.namespace
          value: default
      - template: templates/api-tlsroute.yaml
        documentIndex: 1
        equal:
          path: spec
          value:
            from:
              - group: gateway.networking.k8s.io
                kind: TLSRoute
                namespace: tenant-root
            to:
              - group: ""
                kind: Service
                name: kubernetes

  - it: api not in expose-services renders neither template
    set:
      _cluster:
        root-host: example.org
        expose-services: "dashboard"
        gateway-enabled: "true"
    asserts:
      - template: templates/api-tlsroute.yaml
        hasDocuments:
          count: 0
      - template: templates/api-ingress.yaml
        hasDocuments:
          count: 0

  - it: gateway-enabled=true with custom expose-ingress targets that namespace's Gateway
    set:
      _cluster:
        root-host: example.org
        expose-services: "api"
        expose-ingress: "tenant-foo"
        gateway-enabled: "true"
    asserts:
      - template: templates/api-tlsroute.yaml
        documentIndex: 0
        equal:
          path: spec.parentRefs[0].namespace
          value: tenant-foo
