# Chainsaw port of hack/e2e-apps/vminstance.bats. Three scenarios: a standalone
# VMDisk, VMDisks cloned from a golden image and from another disk, and a
# VMInstance booting from its own VMDisk. The first and last download the
# Ubuntu noble cloud image, so the readiness timeouts are generous. Chainsaw
# deletes the CRs it applied at cleanup.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: vmdisk
spec:
  catch:
  - events: {}
  - describe:
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: vm-disk-test
  steps:
  - name: create-vmdisk
    try:
    - apply:
        file: vmdisk.yaml
  - name: wait-vmdisk-ready
    try:
    - assert:
        timeout: 6m
        resource:
          apiVersion: helm.toolkit.fluxcd.io/v2
          kind: HelmRelease
          metadata:
            name: vm-disk-test
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
    - assert:
        timeout: 5m
        resource:
          apiVersion: cdi.kubevirt.io/v1beta1
          kind: DataVolume
          metadata:
            name: vm-disk-test
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
    - assert:
        timeout: 4m
        resource:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: vm-disk-test
          status:
            phase: Bound
---
# VMDisk clone paths: source.image clones a golden image from cozy-public, and
# source.disk clones that disk in turn, so only the golden image downloads.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: vmdisk-clone
spec:
  catch:
  - events: {}
  - events:
      namespace: cozy-public
  - describe:
      apiVersion: cdi.kubevirt.io/v1beta1
      kind: DataVolume
  - describe:
      apiVersion: cdi.kubevirt.io/v1beta1
      kind: DataVolume
      namespace: cozy-public
      name: vm-default-images-e2e-alpine-3.21
  - describe:
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
  steps:
  - name: create-golden-image
    try:
    - apply:
        file: golden-image.yaml
    - assert:
        timeout: 10m
        resource:
          apiVersion: cdi.kubevirt.io/v1beta1
          kind: DataVolume
          metadata:
            name: vm-default-images-e2e-alpine-3.21
            namespace: cozy-public
          status:
            phase: Succeeded
  - name: clone-from-image
    try:
    - apply:
        file: vmdisk-image-clone.yaml
    - assert:
        resource:
          apiVersion: helm.toolkit.fluxcd.io/v2
          kind: HelmRelease
          metadata:
            name: vm-disk-image-clone
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
    # The vm-disk release goes Ready as soon as the DataVolume exists, so this
    # assert is the one that waits for the clone itself.
    - assert:
        timeout: 10m
        resource:
          apiVersion: cdi.kubevirt.io/v1beta1
          kind: DataVolume
          metadata:
            name: vm-disk-image-clone
          spec:
            source:
              pvc:
                name: vm-default-images-e2e-alpine-3.21
                namespace: cozy-public
          status:
            phase: Succeeded
    - assert:
        timeout: 2m
        resource:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: vm-disk-image-clone
          status:
            phase: Bound
  - name: clone-from-disk
    try:
    - apply:
        file: vmdisk-disk-clone.yaml
    - assert:
        resource:
          apiVersion: helm.toolkit.fluxcd.io/v2
          kind: HelmRelease
          metadata:
            name: vm-disk-disk-clone
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
    - assert:
        timeout: 10m
        resource:
          apiVersion: cdi.kubevirt.io/v1beta1
          kind: DataVolume
          metadata:
            name: vm-disk-disk-clone
          spec:
            source:
              pvc:
                name: vm-disk-image-clone
                namespace: ($namespace)
          status:
            phase: Succeeded
    - assert:
        timeout: 2m
        resource:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: vm-disk-disk-clone
          status:
            phase: Bound
---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: vminstance
spec:
  catch:
  - events: {}
  - describe:
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: vm-instance-test
  - describe:
      apiVersion: kubevirt.io/v1
      kind: VirtualMachineInstance
      name: vm-instance-test
  steps:
  - name: create-vmdisk
    try:
    - apply:
        file: vmdisk-vmi.yaml
    - assert:
        timeout: 6m
        resource:
          apiVersion: helm.toolkit.fluxcd.io/v2
          kind: HelmRelease
          metadata:
            name: vm-disk-vmi-test
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
    - assert:
        timeout: 5m
        resource:
          apiVersion: cdi.kubevirt.io/v1beta1
          kind: DataVolume
          metadata:
            name: vm-disk-vmi-test
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
    - assert:
        timeout: 4m
        resource:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: vm-disk-vmi-test
          status:
            phase: Bound
  - name: create-vminstance
    try:
    - apply:
        file: vminstance.yaml
    - assert:
        timeout: 6m
        resource:
          apiVersion: helm.toolkit.fluxcd.io/v2
          kind: HelmRelease
          metadata:
            name: vm-instance-test
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
  - name: wait-vm-running
    try:
    # Nested KubeVirt startup (virt-launcher + libvirt + cloud-init DHCP) takes
    # 30-60s; allow a generous bound for the IP to appear, then VM Ready.
    - assert:
        timeout: 5m
        resource:
          apiVersion: kubevirt.io/v1
          kind: VirtualMachineInstance
          metadata:
            name: vm-instance-test
          (status.interfaces[0].ipAddress != null): true
    - assert:
        timeout: 5m
        resource:
          apiVersion: kubevirt.io/v1
          kind: VirtualMachine
          metadata:
            name: vm-instance-test
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
